      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend
        working-directory: ./src/backend/app
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      - name: Install frontend deps
        working-directory: ./src/frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./src/frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: ./src/frontend
        run: nohup npm start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &

      - name: Wait for servers
        run: sleep 60

      - name: Run E2E tests
        working-directory: ./src/frontend
        run: npx playwright test

  # Stress Test — needs DB because it hits /movies/search, /genres, /movies/browseByFirstLetter
  stress-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend
        working-directory: ./src/backend/app
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend
        run: sleep 60

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          mkdir -p /root/.gnupg && chmod 700 /root/.gnupg
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run Stress Test
        working-directory: ./src/backend/app/tests/stress
        run: k6 run stress.js

  # ─────────────────────────────────────────────────────────────────────────────
  # Robustness tests are split into two jobs because:
  #
  #   robustness-with-db    → Scenarios 1, 3, 4  (normal ops, pool exhaustion,
  #                           not-found) — all require a live database.
  #
  #   robustness-no-db      → Scenario 2 only    (DB-down resilience) — the
  #                           whole point is that NO database is reachable, so
  #                           we intentionally omit the postgres service and
  #                           pass a bad DB URL so the backend cannot connect.
  # ─────────────────────────────────────────────────────────────────────────────

  # Robustness: Scenarios 1, 3, 4 — DB required
  robustness-with-db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend
        working-directory: ./src/backend/app
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend
        run: sleep 60

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          mkdir -p /root/.gnupg && chmod 700 /root/.gnupg
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run Robustness Scenario 1 — Normal Operation
        working-directory: ./src/backend/app/tests/robustness
        run: k6 run scenario1.js

      - name: Run Robustness Scenario 3 — Pool Exhausted
        working-directory: ./src/backend/app/tests/robustness
        run: k6 run scenario3.js

      - name: Run Robustness Scenario 4 — Not Found
        working-directory: ./src/backend/app/tests/robustness
        run: k6 run scenario4.js

  # Robustness: Scenario 2 — DB deliberately down, no postgres service
  robustness-no-db:
    runs-on: ubuntu-latest

    # No `services:` block here — that is intentional.
    # The backend will start but immediately fail to connect to any database,
    # which is exactly the condition Scenario 2 is testing.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/doesnotexist
      SPRING_DATASOURCE_USERNAME: nobody
      SPRING_DATASOURCE_PASSWORD: nobody

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend (no DB — expected to fail DB connections)
        working-directory: ./src/backend/app
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend to start
        run: sleep 60

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          mkdir -p /root/.gnupg && chmod 700 /root/.gnupg
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run Robustness Scenario 2 — Database Down
        working-directory: ./src/backend/app/tests/robustness
        run: k6 run scenario2.js