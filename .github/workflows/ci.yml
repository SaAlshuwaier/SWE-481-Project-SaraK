          INSERT INTO stars_in_movies (star_id, movie_id) VALUES
            ('nm0591555','tt0400548'),
            ('nm1651765','tt0395796'),
            ('nm1651765','tt0000001'),
            ('nm1636964','tt0413051'),
            ('nm0000095','tt0378947'),
