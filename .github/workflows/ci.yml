            (13,'Horror'),(14,'Music'),(15,'Mystery'),(16,'Romance'),
            (17,'Sci-Fi'),(18,'Sport'),(19,'Thriller'),(20,'War'),
            (21,'Western'),(28,'Action')
          ON CONFLICT DO NOTHING;

          -- Genres in movies ──────────────────────────────────────────────
          INSERT INTO genres_in_movies ("genreId","movieId") VALUES
            (8,'tt0378947'),(5,'tt0378947'),(16,'tt0378947'),
            (15,'tt0413051'),(8,'tt0461892'),(8,'tt0111161'),
            (6,'tt0068646'),(17,'tt0816692'),(17,'tt1375666'),
            (20,'tt0449881'),(1,'tt0000001'),(1,'tt0000002'),
            (28,'tt0000001'),(28,'tt0000002')
          ON CONFLICT DO NOTHING;

          -- Stars ─────────────────────────────────────────────────────────
          INSERT INTO stars (id, name, "birthYear") VALUES
            ('nm0591555','Lorenzo Minoli',1950),
            ('nm1651765','Gregory Bayne',1973),
            ('nm1636964','Phantom Artsy',1970),
            ('nm0000095','Woody Allen',1935),
            ('nm0000168','Chiwetel Ejiofor',1974),
            ('nm0001706','Wallace Shawn',1943)
          ON CONFLICT DO NOTHING;

          -- Stars in movies ───────────────────────────────────────────────
          INSERT INTO stars_in_movies ("starId","movieId") VALUES
            ('nm0591555','tt0400548'),
            ('nm1651765','tt0395796'),
            ('nm1651765','tt0000001'),
            ('nm1636964','tt0413051'),
            ('nm0000095','tt0378947'),
            ('nm0000168','tt0378947'),
            ('nm0001706','tt0378947')
          ON CONFLICT DO NOTHING;

          -- Credit cards ──────────────────────────────────────────────────
          INSERT INTO creditcards (id, "firstName", "lastName", expiration) VALUES
            ('1354895485215896548','Janet','Trink','2004-03-25'),
            ('0011223344556677','Jana','Alshreef','2027-12-31')
          ON CONFLICT DO NOTHING;

          -- Customers ─────────────────────────────────────────────────────
          INSERT INTO customers ("firstName","lastName","ccId",address,email,password) VALUES
            ('Parker','Test','0011223344556677','Test City','Parker234@aol.com','test'),
            ('CC','User','0011223344556677','Test City','cc@msn.com','1111'),
            ('Janet','Trink','1354895485215896548','Test City','janet@trink.com','pw')
            ('Hailah','Saad','1234567890123456','Riyadh','hailah@email.com','1234')
          ON CONFLICT DO NOTHING;

          -- Sync sequences ────────────────────────────────────────────────
          SELECT setval(pg_get_serial_sequence('genres',    'id'), COALESCE((SELECT MAX(id) FROM genres),    1), true);
          SELECT setval(pg_get_serial_sequence('customers', 'id'), COALESCE((SELECT MAX(id) FROM customers), 1), true);
          SELECT setval(pg_get_serial_sequence('sales',     'id'), COALESCE((SELECT MAX(id) FROM sales),     1), true);

          SQL

      - name: Build and Run Tests
        working-directory: ./src/backend/app
        # jOOQ codegen runs automatically here during the generate-sources phase.
        # It connects to the temp DB using DB_URL/DB_USER/DB_PASS (set above),
        # reads the schema, and regenerates the Java classes into
        # target/generated-sources/jooq before compiling and running tests.
        # This is why we need the DB seeded BEFORE this step.
        run: ./mvnw clean test

  # JOB 3: frontend-tests
  # Runs all Angular unit tests (Vitest).
  # These tests are 100% mocked. No backend and no
  # database is needed at all. This is the fastest job in the pipeline.
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache downloaded npm packages between runs.
          # Points to package-lock.json so the cache is invalidated automatically
          # whenever dependencies change.
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm install

      - name: Run Angular tests
        working-directory: ./src/frontend
        run: npm run test -- --watch=false

  # JOB 4: playwright-e2e
  # Runs end-to-end tests using Playwright.
  # They need the full stack running: database + backend + frontend.
  #
  # Flow:
  #   1. Spin up a PostgreSQL container and seed it with real test data
  #   2. Start the Spring Boot backend (connects to the temp DB)
  #   3. Start the Angular frontend (connects to the backend)
  #   4. Wait 60s for both servers to be ready
  #   5. Run Playwright tests against http://localhost:4200
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass
      DB_URL: jdbc:postgresql://localhost:5432/testdb
      DB_USER: testuser
      DB_PASS: testpass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Seed test database
        # Same seed data as backend-tests (E2E tests reference the same)
        # real IDs (cc@msn.com, tt0378947, nm0591555) so the data
        # must match exactly what the Playwright tests expect to see in the UI.
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb <<'SQL'

          -- ── Schema (matches real DB exactly) ──────────────────────────────

          CREATE TABLE IF NOT EXISTS movies (
            id       VARCHAR(10) PRIMARY KEY,
            title    VARCHAR(100) NOT NULL,
            year     INT NOT NULL,
            director VARCHAR(100) NOT NULL
          );

          CREATE TABLE IF NOT EXISTS stars (
            id          VARCHAR(10) PRIMARY KEY,
            name        VARCHAR(100) NOT NULL,
            "birthYear" INT
          );

          CREATE TABLE IF NOT EXISTS stars_in_movies (
            "starId"  VARCHAR(10) NOT NULL REFERENCES stars(id),
            "movieId" VARCHAR(10) NOT NULL REFERENCES movies(id),
            PRIMARY KEY ("starId", "movieId")
          );

          CREATE TABLE IF NOT EXISTS genres (
            id   SERIAL PRIMARY KEY,
            name VARCHAR(32) NOT NULL
          );

          CREATE TABLE IF NOT EXISTS genres_in_movies (
            "genreId" INT         NOT NULL REFERENCES genres(id),
            "movieId" VARCHAR(10) NOT NULL REFERENCES movies(id),
            PRIMARY KEY ("genreId", "movieId")
          );

          CREATE TABLE IF NOT EXISTS creditcards (
            id          VARCHAR(20) PRIMARY KEY,
            "firstName" VARCHAR(50) NOT NULL,
            "lastName"  VARCHAR(50) NOT NULL,
            expiration  DATE NOT NULL
          );

          CREATE TABLE IF NOT EXISTS customers (
            id          SERIAL PRIMARY KEY,
            "firstName" VARCHAR(50) NOT NULL,
            "lastName"  VARCHAR(50) NOT NULL,
            "ccId"      VARCHAR(20) NOT NULL REFERENCES creditcards(id),
            address     VARCHAR(200) NOT NULL,
            email       VARCHAR(50) NOT NULL,
            password    VARCHAR(20) NOT NULL
          );

          CREATE TABLE IF NOT EXISTS sales (
            id           SERIAL PRIMARY KEY,
            "customerId" INT         NOT NULL REFERENCES customers(id),
            "movieId"    VARCHAR(10) NOT NULL REFERENCES movies(id),
            "saleDate"   DATE NOT NULL
          );

          CREATE TABLE IF NOT EXISTS ratings (
            "movieId"  VARCHAR(10) PRIMARY KEY REFERENCES movies(id),
            rating     FLOAT NOT NULL,
            "numVotes" INT NOT NULL
          );

          -- Movies ────────────────────────────────────────────────────────
          INSERT INTO movies (id, title, year, director) VALUES
            ('tt0378947','Melinda and Melinda',2004,'Woody Allen'),
            ('tt0400548','An Italian Affair',2003,'Unknown Director'),
            ('tt0461892','15',2003,'Royston Tan'),
            ('tt0422896','Study',2004,'Layan'),
            ('tt0413051','No Longer My Twin',2002,'Robert G. Christie'),
            ('tt0421974','Sky Fighters',2005,'Gerard Pires'),
            ('tt0278823','Hollywood Ending',2002,'Woody Allen'),
            ('tt0344510','A Very Long Engagement',2004,'Jean-Pierre Jeunet'),
            ('tt0313792','Anything Else',2003,'Woody Allen'),
            ('tt0395796','Trudell',2005,'Heather Rae'),
            ('tt0111161','A Shawshank Story',1994,'Frank Darabont'),
            ('tt0068646','Another Godfather',1972,'Francis Ford Coppola'),
            ('tt0816692','2001 Space Journey',2014,'Christopher Nolan'),
            ('tt1375666','Inception',2010,'Christopher Nolan'),
            ('tt0449881','Letters from Iwo Jima',2006,'Clint Eastwood'),
            ('tt0000001','Alpha Movie',2000,'Some Director'),
            ('tt0000002','Another Alpha Film',2001,'Another Director')
          ON CONFLICT DO NOTHING;

          -- Ratings ───────────────────────────────────────────────────────
          INSERT INTO ratings ("movieId", rating, "numVotes") VALUES
            ('tt0378947',6.5,50000),('tt0400548',5.8,12000),
            ('tt0461892',7.2,8000),('tt0422896',4.2,3000),
            ('tt0413051',1.4,500),('tt0421974',5.9,15000),
            ('tt0278823',6.1,20000),('tt0344510',7.5,30000),
            ('tt0313792',6.3,18000),('tt0395796',6.3,4000),
            ('tt0111161',9.3,2000000),('tt0068646',9.2,1500000),
            ('tt0816692',8.6,1200000),('tt1375666',8.8,2200000),
            ('tt0449881',7.9,200000),('tt0000001',6.0,1000),
            ('tt0000002',5.5,800)
          ON CONFLICT DO NOTHING;

          -- Genres ────────────────────────────────────────────────────────
          INSERT INTO genres (id, name) VALUES
            (1,'Action'),(2,'Adventure'),(3,'Animation'),(4,'Biography'),
            (5,'Comedy'),(6,'Crime'),(7,'Documentary'),(8,'Drama'),
            (9,'Family'),(10,'Fantasy'),(11,'Film-Noir'),(12,'History'),
            (13,'Horror'),(14,'Music'),(15,'Mystery'),(16,'Romance'),
            (17,'Sci-Fi'),(18,'Sport'),(19,'Thriller'),(20,'War'),
            (21,'Western'),(28,'Action')
          ON CONFLICT DO NOTHING;

          -- Genres in movies ──────────────────────────────────────────────
          INSERT INTO genres_in_movies ("genreId","movieId") VALUES
            (8,'tt0378947'),(5,'tt0378947'),(16,'tt0378947'),
            (15,'tt0413051'),(8,'tt0461892'),(8,'tt0111161'),
            (6,'tt0068646'),(17,'tt0816692'),(17,'tt1375666'),
            (20,'tt0449881'),(1,'tt0000001'),(1,'tt0000002'),
            (28,'tt0000001'),(28,'tt0000002')
          ON CONFLICT DO NOTHING;

          -- Stars ─────────────────────────────────────────────────────────
          INSERT INTO stars (id, name, "birthYear") VALUES
            ('nm0591555','Lorenzo Minoli',1950),
            ('nm1651765','Gregory Bayne',1973),
            ('nm1636964','Phantom Artsy',1970),
            ('nm0000095','Woody Allen',1935),
            ('nm0000168','Chiwetel Ejiofor',1974),
            ('nm0001706','Wallace Shawn',1943)
          ON CONFLICT DO NOTHING;

          -- Stars in movies ───────────────────────────────────────────────
          INSERT INTO stars_in_movies ("starId","movieId") VALUES
            ('nm0591555','tt0400548'),
            ('nm1651765','tt0395796'),
            ('nm1651765','tt0000001'),
            ('nm1636964','tt0413051'),
            ('nm0000095','tt0378947'),
            ('nm0000168','tt0378947'),
            ('nm0001706','tt0378947')
          ON CONFLICT DO NOTHING;

          -- Credit cards ──────────────────────────────────────────────────
          INSERT INTO creditcards (id, "firstName", "lastName", expiration) VALUES
            ('1354895485215896548','Janet','Trink','2004-03-25'),
            ('0011223344556677','Jana','Alshreef','2027-12-31')
          ON CONFLICT DO NOTHING;

          -- Customers ─────────────────────────────────────────────────────
          INSERT INTO customers ("firstName","lastName","ccId",address,email,password) VALUES
            ('Parker','Test','0011223344556677','Test City','Parker234@aol.com','test'),
            ('CC','User','0011223344556677','Test City','cc@msn.com','1111'),
            ('Janet','Trink','1354895485215896548','Test City','janet@trink.com','pw')
            ('Hailah','Saad','1234567890123456','Riyadh','hailah@email.com','1234')
          ON CONFLICT DO NOTHING;

          -- ── Sync sequences ────────────────────────────────────────────────
          SELECT setval(pg_get_serial_sequence('genres',    'id'), COALESCE((SELECT MAX(id) FROM genres),    1), true);
          SELECT setval(pg_get_serial_sequence('customers', 'id'), COALESCE((SELECT MAX(id) FROM customers), 1), true);
          SELECT setval(pg_get_serial_sequence('sales',     'id'), COALESCE((SELECT MAX(id) FROM sales),     1), true);

          SQL

      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend
        working-directory: ./src/backend/app
        # Run in background with nohup so the step does not block.
        # Logs go to backend.log — if E2E tests fail you can check this
        # file to see if the backend itself crashed on startup.
        # DB_URL/DB_USER/DB_PASS are set in env above so jOOQ codegen
        # runs successfully before Spring Boot starts.
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm install

      - name: Install Playwright browsers
        # Downloads the actual browser binaries (Chromium, Firefox, WebKit)
        # that Playwright uses to simulate a real user clicking through the UI.
        # --with-deps also installs OS-level libraries each browser needs.
        working-directory: ./src/frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: ./src/frontend
        # Run in background. Angular connects to the backend at localhost:8080.
        run: nohup npm start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &

      - name: Wait for backend to be ready
        # Instead of a blind sleep, we poll the backend health endpoint every
        # 10 seconds for up to 5 minutes (30 attempts). This is much more
        # reliable than sleep because:
        #   - CI machines are slower than local — Spring Boot + jOOQ codegen
        #     + compilation from scratch can take 3-4 minutes on a fresh runner
        #   - We only proceed when the server is actually ready, not after an
        #     arbitrary time that might be too short or wastefully too long
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/genres > /dev/null 2>&1; then
              echo "Backend is ready after $((i * 10))s"
              break
            fi
            echo "Attempt $i/30 — backend not ready yet, waiting 10s..."
            sleep 10
            if [ $i -eq 30 ]; then
              echo "Backend never became ready. Printing backend.log:"
              cat ./src/backend/app/backend.log
              exit 1
            fi
          done

      - name: Wait for frontend to be ready
        # Same polling approach for Angular. It typically starts faster than
        # the backend but we still wait properly rather than guessing.
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4200 > /dev/null 2>&1; then
              echo "Frontend is ready after $((i * 10))s"
              break
            fi
            echo "Attempt $i/20 — frontend not ready yet, waiting 10s..."
            sleep 10
            if [ $i -eq 20 ]; then
              echo "Frontend never became ready. Printing frontend.log:"
              cat ./src/frontend/frontend.log
              exit 1
            fi
          done
        # --timeout=60000        → each test gets 60s instead of the default 30s.
        #                          CI machines are slower so actions like login,
        #                          cart load, and checkout take longer to complete.
        # --retries=1            → retry a failed test up to 1 times before
        #                          marking it as failed. This handles flaky timing
        #                          issues without masking real bugs.
        # --reporter=list        → print each test result as it runs so the CI
        #                          log shows exactly which test failed and why,
        #                          rather than a single summary at the end.
        
      - name: Create auth directory
        run: mkdir -p src/frontend/playwright/.auth

      - name: Run E2E tests
        working-directory: ./src/frontend
        env:
          PLAYWRIGHT_NAVIGATION_TIMEOUT: "60000"
        run: npx playwright test --timeout=60000 --retries=1 --reporter=list
