name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:

  # Simple sanity check
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a simple check
        run: echo "CI is running successfully"

  # Secrets validation
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:
      - uses: actions/checkout@v4
      - name: Check secrets exist
        run: |
          [ -z "$DB_URL" ] && echo "DB_URL missing" && exit 1
          [ -z "$DB_USER" ] && echo "DB_USER missing" && exit 1
          [ -z "$DB_PASS" ] && echo "DB_PASS missing" && exit 1
          echo "DB secrets OK"

  # Backend Tests (Spring Boot)
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Build and Run Tests
        working-directory: ./src/backend/app
        run: ./mvnw clean test

  # Frontend Tests (Angular)
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm install

      - name: Run Angular tests
        working-directory: ./src/frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  # E2E Tests (Playwright)
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1) Start backend
      - name: Make mvnw executable
        run: chmod +x ./src/backend/app/mvnw

      - name: Start backend
        working-directory: ./src/backend/app
        run: nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      # 2) Start frontend
      - name: Install frontend deps
        working-directory: ./src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./src/frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: ./src/frontend
        run: nohup npm start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &

      # 3) Wait for servers to be ready
      - name: Wait for servers
        run: npx wait-on http://localhost:8080 http://localhost:4200 --timeout 60000

      # 4) Run Playwright
      - name: Run E2E tests
        working-directory: ./src/frontend
        run: npx playwright test

  # Stress Test
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run Stress Test
        working-directory: ./src/backend/app/tests/stress
        run: k6 run stress.js

  # Robustness Test
  robustness-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run Robustness Test
        working-directory: ./src/backend/app/tests/robustness
        run: k6 run robustness.js