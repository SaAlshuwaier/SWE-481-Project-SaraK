            ('tt0068646', 7),   -- Crime
            ('tt0816692', 18),  -- Sci-Fi
            ('tt1375666', 18),  -- Sci-Fi
            ('tt0449881', 21),  -- War
            ('tt0000001', 1),   -- Action (genreId=1 for browse-by-genre id=28 test)
            ('tt0000002', 1),
            -- also link some movies to genreId=28 for the browse test
            ('tt0000001', 28),
            ('tt0000002', 28)
          ON CONFLICT DO NOTHING;

          -- ─── Stars ───────────────────────────────────────────────────────────

          INSERT INTO stars (id, name, birth_year) VALUES
            ('nm0591555', 'Lorenzo Minoli',    1950),
            ('nm1651765', 'Gregory Bayne',     1973),
            ('nm1636964', 'Phantom Artsy',     1970),
