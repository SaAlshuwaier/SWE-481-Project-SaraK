name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:


  # Simple sanity check (قديمك)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a simple check
        run: echo "CI is running successfully"

  # Secrets validation
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:
      - uses: actions/checkout@v4
      - name: Check secrets exist
        run: |
          [ -z "$DB_URL" ] && echo "DB_URL missing" && exit 1
          [ -z "$DB_USER" ] && echo "DB_USER missing" && exit 1
          [ -z "$DB_PASS" ] && echo "DB_PASS missing" && exit 1
          echo "DB secrets OK"

 
  # Backend Tests (Spring Boot)
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Run Tests
        run: ./mvnw clean test

  # Frontend Tests (Angular)
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./frontend       
        run: npm install

      - name: Run Angular tests
        working-directory: ./frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  # E2E Tests (Playwright)
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1) Start backend
      - name: Start backend
        run: |
          nohup ./mvnw spring-boot:run > backend.log 2>&1 &

      # 2) Start frontend
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: ./frontend
        run: |
          nohup npm start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &

      # 3) Run Playwright
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test