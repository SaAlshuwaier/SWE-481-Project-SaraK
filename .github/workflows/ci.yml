            ('tt0313792',6.3),('tt0395796',6.3),('tt0111161',9.3),('tt0068646',9.2),
            ('tt0816692',8.6),('tt1375666',8.8),('tt0449881',7.9),
            ('tt0000001',6.0),('tt0000002',5.5)
          ON CONFLICT DO NOTHING;

          INSERT INTO movies_genres (movie_id, genre_id) VALUES
            ('tt0378947',9),('tt0378947',6),('tt0378947',17),
            ('tt0413051',16),('tt0461892',9),('tt0111161',9),
            ('tt0068646',7),('tt0816692',18),('tt1375666',18),
            ('tt0449881',21),('tt0000001',1),('tt0000002',1),
            ('tt0000001',2),('tt0000002',2),('tt0000001',28),('tt0000002',28)
          ON CONFLICT DO NOTHING;

          INSERT INTO stars (id, name, birth_year) VALUES
            ('nm0591555','Lorenzo Minoli',1950),
            ('nm1651765','Gregory Bayne',1973),
