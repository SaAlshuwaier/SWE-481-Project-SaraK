      - name: Build and Run Tests
        working-directory: ./src/backend/app
        run: ./mvnw clean test

  # Frontend Tests (Angular)
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'                           # cache npm dependencies
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm install

      - name: Run Angular tests
        working-directory: ./src/frontend
        run: npm run test -- --watch=false

  # E2E Tests (Playwright)
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'                         # cache Maven dependencies

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'                           # cache npm dependencies
          cache-dependency-path: src/frontend/package-lock.json

      - name: Seed test database
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb <<'SQL'

          CREATE TABLE IF NOT EXISTS movies (
            id VARCHAR(20) PRIMARY KEY, title VARCHAR(255), year INT, director VARCHAR(255)
          );
          CREATE TABLE IF NOT EXISTS ratings (
            movie_id VARCHAR(20) PRIMARY KEY REFERENCES movies(id), rating NUMERIC(3,1)
          );
          CREATE TABLE IF NOT EXISTS genres (
