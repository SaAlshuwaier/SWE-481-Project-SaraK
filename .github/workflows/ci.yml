            ('Parker','Test','Parker234@aol.com','test','Test City'),
            ('CC','User','cc@msn.com','1111','Test City'),
            ('Janet','Trink','janet@trink.com','pw','Test City')
          ON CONFLICT DO NOTHING;

          INSERT INTO credit_cards (customer_id, cc_number, expiration, first_name, last_name)
          SELECT c.id,'1354895485215896548','2004-03-25','Janet','Trink'
