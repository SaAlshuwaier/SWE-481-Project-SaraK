            customer_id INT REFERENCES customers(id),
            cc_number   VARCHAR(50),
            expiration  DATE,
            first_name  VARCHAR(100),
            last_name   VARCHAR(100)
          );

          CREATE TABLE IF NOT EXISTS sales (
            id          SERIAL PRIMARY KEY,
            customer_id INT REFERENCES customers(id),
            movie_id    VARCHAR(20) REFERENCES movies(id),
            sale_date   DATE
