<nav class="navbar d-flex justify-content-between align-items-center px-3">
  <div class="d-flex gap-3">
    <a routerLink="/home" class="nav-link">Home</a>
    <a routerLink="/movies" class="nav-link">Movies</a>
    <a routerLink="/cart" class="nav-link">Cart</a>
  </div>

  <div>
    <a class="nav-link"  (click)="openLogoutModal()">Logout</a>
  </div>
</nav>

  <!-- Logout Modal -->
<div *ngIf="showConfirm()" class="modal d-block" tabindex="-1" role="dialog">
<div class="modal-dialog modal-dialog-centered modal-md-down" role="document">
    <div class="modal-content">

      <div class="modal-header justify-content-center">
        <h5 class="modal-title">Confirm Logout</h5>
      </div>

      <div class="modal-body justify-content-center">
        <p class="mb-0">Are you sure you want to logout?</p>
      </div>

      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary btn-md" (click)="closeLogoutModal()">Cancel</button>
        <button type="button" class="btn btn-primary btn-md" (click)="confirmLogout()">Yes, Logout</button>
      </div>

    </div>
  </div>
</div>

<!-- Backdrop -->
<div *ngIf="showConfirm()" class="modal-backdrop fade show"></div>
