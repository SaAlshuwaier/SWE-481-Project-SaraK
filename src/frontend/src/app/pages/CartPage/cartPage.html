<section class="container py-5">
  <div class="card shadow-sm p-4">
    <h2 class="cart-title">Shopping Cart</h2>

    <!-- When cart is not loaded yet -->
    <div *ngIf="!cart()" class="text-center py-5" >
      <div class="text-muted" >No cart loaded.</div>
    </div>

    <!-- When cart exists -->
    <div *ngIf="cart() as c">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="meta-row">
          <span class="text-muted">Total Quantity</span>
          <span class="fw-bold">
            {{ c.totalQuantity }}
          </span>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle" *ngIf="c.items && c.items.length > 0; else emptyCart">
          <thead class="table-light">
            <tr>
              <th>Movie</th>
              <th class="text-center">Quantity</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let it of c.items">
              <td>
                <span class="fw-medium">
                  {{ it.title }}
                </span>
              </td>

              <td class="text-center">
                <input class="form-control text-center" type="number" min="0" [value]="it.quantity"
                  (input)="updateItemById(it.movieId, +$any($event.target).value)" [disabled]="isLoading()"
                  aria-label="Quantity"/>
              </td>

              <td class="text-end">
                <button class="btn btn-danger btn-sm" (click)="deleteItemById(it.movieId)" [disabled]="isLoading()">
                  Remove
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #emptyCart>
          <div class="text-center py-4 text-muted">Cart is empty.</div>
        </ng-template>
      </div>

      <div class="d-flex align-items-center mt-4">
        <button class="btn btn-danger" (click)="clearCartLocal()" [disabled]="isLoading()">
          Clear Cart
        </button>

        <div class="d-flex gap-2 ms-auto">
          <button class="btn btn-outline-secondary" type="button" routerLink="/movies">
            Continue Shopping
          </button>
          <button class="btn btn-primary" type="button" routerLink="/checkout"
            [disabled]="c.items.length === 0">
            Proceed to Checkout
          </button>
        </div>
      </div>

      <!-- Loading / Error -->
      <div *ngIf="isLoading()" class="text-muted mt-3">
        Loading…
      </div>

      <div *ngIf="error()" class="alert alert-danger mt-3">
        {{ error() }}
      </div>
    </div>
  </div>
</section>
