<section class="container py-5">
  <div class="card shadow-sm p-4" data-testid="cart-page">
    <h2 class="cart-title">Shopping Cart</h2>

    <!-- When cart is not loaded yet -->
    <div *ngIf="!cart()" class="text-center py-5" data-testid="cart-not-loaded">
      <div class="text-muted" data-testid="cart-not-loaded-text">No cart loaded.</div>
    </div>

    <!-- When cart exists -->
    <div *ngIf="cart() as c" data-testid="cart-loaded">
      <div class="d-flex justify-content-between align-items-center mb-3" data-testid="cart-meta">
        <div class="meta-row">
          <span class="text-muted">Total Quantity</span>
          <span class="fw-bold" data-testid="cart-total-qty">
            {{ c.totalQuantity }}
          </span>
        </div>
      </div>

      <div class="table-responsive" data-testid="cart-table-wrap">
        <table
          class="table align-middle"
          *ngIf="c.items && c.items.length > 0; else emptyCart"
          data-testid="cart-table"
        >
          <thead class="table-light">
            <tr>
              <th>Movie</th>
              <th class="text-center">Quantity</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody data-testid="cart-tbody">
            <tr *ngFor="let it of c.items" data-testid="cart-row">
              <td>
                <span class="fw-medium" data-testid="cart-item-title">
                  {{ it.title }}
                </span>
                <span class="text-muted ms-2" data-testid="cart-item-id">
                  {{ it.movieId }}
                </span>
              </td>

              <td class="text-center">
                <input
                  class="form-control text-center"
                  type="number"
                  min="0"
                  [value]="it.quantity"
                  (input)="updateItemById(it.movieId, +$any($event.target).value)"
                  [disabled]="isLoading()"
                  aria-label="Quantity"
                  data-testid="cart-qty-input"
                />
              </td>

              <td class="text-end">
                <button
                  class="btn btn-danger btn-sm"
                  (click)="deleteItemById(it.movieId)"
                  [disabled]="isLoading()"
                  data-testid="remove-item"
                >
                  Remove
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #emptyCart>
          <div class="text-center py-4 text-muted" data-testid="cart-empty">Cart is empty.</div>
        </ng-template>
      </div>

      <div class="d-flex align-items-center mt-4">
        <button
          class="btn btn-danger"
          (click)="clearCartLocal()"
          [disabled]="isLoading()"
          data-testid="clear-cart"
        >
          Clear Cart
        </button>

          <div class="d-flex gap-2 ms-auto">
            <button
            class="btn btn-outline-secondary"
            type="button"
            routerLink="/movies"
           data-testid="continue-shopping" >
           Continue Shopping
            </button>
            <button
              class="btn btn-primary"
               type="button"
                routerLink="/checkout"
                data-testid="proceed-checkout"
                >
                Proceed to Checkout
              </button>
            </div>
          </div>

      <!-- Loading / Error -->
      <div *ngIf="isLoading()" class="text-muted mt-3" data-testid="cart-loading">
        Loading…
      </div>

      <div *ngIf="error()" class="alert alert-danger mt-3" data-testid="cart-error">
        {{ error() }}
      </div>
    </div>
  </div>
</section>
