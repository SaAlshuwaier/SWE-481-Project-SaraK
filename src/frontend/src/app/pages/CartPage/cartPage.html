<header class="app-header">
  <img class="app-logo" src="/favicon.ico" alt="PLOT BOX logo" />

  <div class="app-title">
    <h1>PLOT BOX</h1>
    <p>Cart</p>
  </div>
</header>

<section class="page-wrap">
  <div class="cart-card" data-testid="cart-page">
    <h2 class="cart-title">Shopping Cart</h2>

    <!-- When cart is not loaded yet -->
    <div *ngIf="!cart()" class="empty-block" data-testid="cart-not-loaded">
      <div class="empty" data-testid="cart-not-loaded-text">No cart loaded.</div>

      <div class="cart-footer">
        <button
          class="btn btn-ghost"
          (click)="loadCart()"
          [disabled]="isLoading()"
          data-testid="load-cart"
        >
          Load Cart
        </button>
      </div>
    </div>

    <!-- When cart exists -->
    <div *ngIf="cart() as c" data-testid="cart-loaded">
      <div class="meta" data-testid="cart-meta">
        <div class="meta-row">
          <span class="meta-label">Total Quantity</span>
          <span class="meta-value" data-testid="cart-total-qty">
            {{ c.totalQuantity }}
          </span>
        </div>
      </div>

      <div class="table-wrap" data-testid="cart-table-wrap">
        <table
          class="cart-table"
          *ngIf="c.items && c.items.length > 0; else emptyCart"
          data-testid="cart-table"
        >
          <thead>
            <tr>
              <th>Movie</th>
              <th class="col-qty">Quantity</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>

          <tbody data-testid="cart-tbody">
            <tr *ngFor="let it of c.items" data-testid="cart-row">
              <td class="movie-cell">
                <span class="movie-title" data-testid="cart-item-title">
                  {{ it.title }}
                </span>
                <span class="movie-id" data-testid="cart-item-id">
                  {{ it.movieId }}
                </span>
              </td>

              <td class="qty-cell">
                <input
                  class="qty-input"
                  type="number"
                  min="0"
                  [value]="it.quantity"
                  (input)="updateItemById(it.movieId, +$any($event.target).value)"
                  [disabled]="isLoading()"
                  aria-label="Quantity"
                  data-testid="cart-qty-input"
                />
              </td>

              <td class="actions-cell">
                <button
                  class="btn btn-danger"
                  (click)="deleteItemById(it.movieId)"
                  [disabled]="isLoading()"
                  data-testid="remove-item"
                >
                  Remove
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #emptyCart>
          <div class="empty" data-testid="cart-empty">Cart is empty.</div>
        </ng-template>
      </div>

      <div class="cart-footer" data-testid="cart-footer">
        <button
          class="btn btn-ghost"
          (click)="clearCartLocal()"
          [disabled]="isLoading()"
          data-testid="clear-cart"
        >
          Clear Cart
        </button>

<button
  class="btn btn-ghost"
  type="button"
  routerLink="/movies"
  data-testid="continue-shopping"
>
  Continue Shopping
</button>

<button
  class="btn btn-primary"
  type="button"
  routerLink="/checkout"
  data-testid="proceed-checkout"
>
  Proceed to Checkout
</button>
      </div>

      <!-- Loading / Error -->
      <div *ngIf="isLoading()" class="muted" data-testid="cart-loading">
        Loading…
      </div>

      <div *ngIf="error()" class="err-box" data-testid="cart-error">
        {{ error() }}
      </div>
    </div>
  </div>
</section>
