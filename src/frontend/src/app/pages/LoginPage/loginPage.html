<header class="px-4 py-3 border-bottom d-flex align-items-center gap-2">
  <span class="fw-bold fs-5">PLOT BOX</span>
</header>
<section class="page-wrap container d-flex justify-content-center align-items-center pt-5">
  <div class="row w-100 justify-content-center">

    <div class="card shadow-sm p-5 col-12 col-md-7 col-lg-6 mb-5">

      <p class="text-muted text-center mb-0 fs-5">Welcome back </p>
      <h2 class="title text-center mb-4 mt-3 fs-3">Sign in</h2>

      <div class="form d-flex flex-column gap-3">

        <!-- Email -->
        <div>
          <label class="label form-label fw-semibold text-secondary small" for="email">Email</label>
          <input class="input form-control" id="email" type="email" [value]="email()" (keydown)="allowOnlyEnglish($event)"
            (input)="onEmailInput(($any($event.target).value))" (blur)="markEmailTouched()"
            placeholder="name@example.com"/>
        </div>

        <div *ngIf="emailTouched() && !isValidEmail(email())" class="err-box text-danger small">
          Invalid email format
        </div>

        <!-- Password -->
        <div>
          <label class="label form-label fw-semibold text-secondary small" for="password">Password</label>
          <input class="input form-control" id="password" type="password" [value]="password()" (keydown)="allowOnlyEnglish($event)"
            (input)="onPasswordInput(($any($event.target).value))" placeholder="••••••••"
            />
        </div>

        <!-- Button -->
        <button class="btn btn-primary w-100" (click)="submit()"
          [disabled]="isLoading() || !isValidEmail(email()) || !password()">
          {{ isLoading() ? 'Signing in…' : 'Sign in' }}
        </button>

        <!-- Register -->
        <p class="register-link text-center small text-muted mt-2">
          Don't have an account?
          <a routerLink="/register">Register here</a>
        </p>

        <!-- Error -->
        <div *ngIf="error()" class="err-box text-danger small mt-2">
          {{ error() }}
        </div>

        <!-- Success -->
        <div *ngIf="result()" class="ok-box alert alert-success mt-2">
          {{ result()?.message }}
        </div>

      </div>

    </div>
  </div>

</section>
