<header class="app-header">
  <img class="app-logo" src="/favicon.ico" alt="PLOT BOX logo" />

  <div class="app-title">
    <h1>PLOT BOX</h1>
    <p>Login</p>
  </div>
</header>

<section class="page-wrap">
  <div class="card" data-testid="login-page">

    <h2 class="title" data-testid="login-title">Sign in</h2>

    <div class="form">
      <label class="label">Email</label>
      <input
        class="input"
        type="email"
        [value]="email()"
        (input)="onEmailInput(($any($event.target).value))"
        placeholder="name@example.com"
        data-testid="login-email"
      />

      <label class="label">Password</label>
      <input
        class="input"
        type="password"
        [value]="password()"
        (input)="onPasswordInput(($any($event.target).value))"
        placeholder="••••••••"
        data-testid="login-password"
      />

      <button
        class="btn"
        (click)="submit()"
        [disabled]="isLoading()"
        data-testid="login-submit"
      >
        {{ isLoading() ? 'Signing in…' : 'Login' }}
      </button>

      <div *ngIf="error()" class="err-box" data-testid="login-error">
        {{ error() }}
      </div>

      <div *ngIf="result()" class="ok-box" data-testid="login-success">
        <div class="ok-title">Response</div>
        <div class="ok-text" data-testid="login-success-message">
          {{ result()?.message }}
        </div>
      </div>
    </div>

  </div>
</section>
