<div class="container my-4">
  <div class="card shadow-sm">
    <div class="card-body">

      <div *ngIf="isLoading()" class="text-muted" data-testid="movie-loading">
        Loading movie details…
      </div>

      <div *ngIf="error()" class="text-danger mb-3" data-testid="movie-error">
        {{ error() }}
      </div>

      <ng-container *ngIf="!isLoading() && movie() as m">
        <h2 class="fw-bold mb-4" data-testid="movie-title">
          {{ m.title }}
        </h2>

        <div class="mb-4">
          <p class="mb-2">
            <strong>Year:</strong>
            <span data-testid="movie-year">{{ m.year }}</span>
          </p>

          <p class="mb-2">
            <strong>Director:</strong>
            <span data-testid="movie-director">{{ m.director }}</span>
          </p>

          <p class="mb-2">
            <strong>Rating:</strong>
            <span data-testid="movie-rating">{{ formatRating(m.rating) }}</span>
          </p>

          <p class="mb-0">
            <strong>Genres:</strong>
            <span data-testid="movie-genres">
              <ng-container *ngIf="m.genres?.length; else noGenres">
                <span *ngFor="let g of m.genres; let last = last" data-testid="genre-item">
                  {{ g.name }}<span *ngIf="!last">, </span>
                </span>
              </ng-container>
              <ng-template #noGenres>
                <span data-testid="no-genres">-</span>
              </ng-template>
            </span>
          </p>
        </div>

        <div class="mb-4">
          <h5 class="fw-bold mb-3">Stars</h5>

          <div *ngIf="!m.stars?.length" class="text-muted" data-testid="no-stars">
            No stars found.
          </div>

          <ul class="link-list ps-3 mb-0" *ngIf="m.stars?.length" data-testid="stars-list">
            <li *ngFor="let s of m.stars" class="mb-1">
              <a
                class="link"
                data-testid="star-link"
                [routerLink]="['/stars', s.id]">
                {{ s.name }}
              </a>
            </li>
          </ul>
        </div>

        <div>
          <h5 class="fw-bold mb-3">Add to Cart</h5>

          <div class="d-flex align-items-center gap-2 mb-3">
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="decQty()"
              data-testid="qty-dec">
              -
            </button>

            <input
              class="form-control text-center"
              data-testid="qty-input"
              type="number"
              min="1"
              [value]="quantity()"
              (input)="onQtyInput(($any($event.target)).value)" />

            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="incQty()"
              data-testid="qty-inc">
              +
            </button>
          </div>

          <button
            type="button"
            class="btn btn-primary"
            (click)="addToCart()"
            data-testid="add-to-cart">
            Add to Cart
          </button>

          <div *ngIf="cartError()" class="text-danger mt-2" data-testid="cart-error">
            {{ cartError() }}
          </div>
        </div>
      </ng-container>

    </div>
  </div>
</div>
