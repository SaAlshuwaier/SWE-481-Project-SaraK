 <!-- Update the whole code by using bootstrap layout, no inling styling, with keeping all existing test ids and does not touch the TS logic -->

 
 <div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">

      <div *ngIf="isLoading()" class="text-muted" data-testid="movie-loading">
        Loading movie details…
      </div>

      <div *ngIf="error()" class="alert alert-danger mb-3" data-testid="movie-error">
        {{ error() }}
      </div>

      <ng-container *ngIf="!isLoading() && movie() as m">


  <button
    type="button"
    class="btn btn-link ps-0 mb-3 text-decoration-none"
    (click)="backToMovies()"
    data-testid="back-to-movies"
  >
    ← Back to Movies
  </button>

  <div class="mb-4">
    <p class="text-uppercase text-muted fw-bold small mb-2">Movie Details</p>
    <h2 class="fw-bold mb-0" data-testid="movie-title">{{ m.title }}</h2>
  </div>

        <div class="row g-4">
          <div class="col-12 col-lg-7">
            <div class="card h-100 border-0 bg-light">
              <div class="card-body">
                <h5 class="fw-bold mb-3">Overview</h5>

                <div class="mb-3">
                  <span class="fw-bold d-block">Year</span>
                  <span data-testid="movie-year">{{ m.year }}</span>
                </div>

                <div class="mb-3">
                  <span class="fw-bold d-block">Director</span>
                  <span data-testid="movie-director">{{ m.director }}</span>
                </div>

                <div class="mb-3">
                  <span class="fw-bold d-block">Rating</span>
                  <span data-testid="movie-rating">{{ formatRating(m.rating) }}</span>
                </div>

                <div>
                  <span class="fw-bold d-block mb-2">Genres</span>
                  <div data-testid="movie-genres">
                    <ng-container *ngIf="m.genres?.length; else noGenres">
                      <span
                        *ngFor="let g of m.genres; let last = last"
                        class="badge text-bg-light border me-2 mb-2"
                        data-testid="genre-item">
                        {{ g.name }}
                      </span>
                    </ng-container>

                    <ng-template #noGenres>
                      <span data-testid="no-genres">-</span>
                    </ng-template>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-5">
            <div class="card h-100 border-0 bg-light">
              <div class="card-body">
                <h5 class="fw-bold mb-3">Stars</h5>

                <div *ngIf="!m.stars?.length" class="text-muted" data-testid="no-stars">
                  No stars found.
                </div>

                <ul class="list-group list-group-flush link-list" *ngIf="m.stars?.length" data-testid="stars-list">
                  <li class="list-group-item bg-transparent px-0" *ngFor="let s of m.stars">
                    <a class="text-decoration-none link" data-testid="star-link" [routerLink]="['/stars', s.id]">
                      {{ s.name }}
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div class="col-12">
            <div class="card border-0 bg-light">
              <div class="card-body">
                <h5 class="fw-bold mb-3">Add to Cart</h5>

                <div class="d-flex align-items-center gap-2 mb-3">
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="decQty()"
                    data-testid="qty-dec">
                    -
                  </button>

                  <input
                    class="form-control text-center w-auto"
                    data-testid="qty-input"
                    type="number"
                    min="1"
                    [value]="quantity()"
                    (input)="onQtyInput(($any($event.target)).value)" />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="incQty()"
                    data-testid="qty-inc">
                    +
                  </button>
                </div>

                <button
                  type="button"
                  class="btn btn-primary"
                  (click)="addToCart()"
                  data-testid="add-to-cart">
                  Add to Cart
                </button>

                <div *ngIf="cartError()" class="text-danger mt-2" data-testid="cart-error">
                  {{ cartError() }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

    </div>
  </div>
</div>
