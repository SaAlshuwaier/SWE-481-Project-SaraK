<header class="app-header">
  <img class="app-logo" src="/favicon.ico" alt="PLOT BOX logo" />
  <div class="app-title">
    <h1>PLOT BOX</h1>
    <p>Create Account</p>
  </div>
</header>

<section class="page-wrap">
  <div class="card" data-testid="register-page">
    <h2 class="title" data-testid="register-title">Register</h2>

    <div class="form">

      <!-- Customer fields -->
      <label class="label">First Name</label>
      <input
        class="input"
        [value]="firstName()"
        (input)="setFirstName(($any($event.target).value))"
        data-testid="reg-firstname"
        maxlength="50"
      />

      <label class="label">Last Name</label>
      <input
        class="input"
        [value]="lastName()"
        (input)="setLastName(($any($event.target).value))"
        data-testid="reg-lastname"
        maxlength="50"
      />

      <label class="label">Email</label>
      <input
        class="input"
        type="email"
        [value]="email()"
        (input)="setEmail(($any($event.target).value))"
        (blur)="emailTouched.set(true)"
        placeholder="name@example.com"
        data-testid="reg-email"
        maxlength="50"
      />
      <div *ngIf="emailTouched() && !isValidEmail(email())" class="err-box">
        Invalid email format
      </div>

      <label class="label">Password</label>
      <input
        class="input"
        type="password"
        [value]="password()"
        (input)="setPassword(($any($event.target).value))"
        placeholder="••••••••"
        data-testid="reg-password"
        maxlength="20"
      />

      <label class="label">Address</label>
      <input
        class="input"
        [value]="address()"
        (input)="setAddress(($any($event.target).value))"
        data-testid="reg-address"
        maxlength="200"
      />

      <!-- Credit card fields -->
      <label class="label">Card Number</label>
      <input
        class="input"
        [value]="ccNumber()"
        (input)="setCcNumber(($any($event.target).value))"
        placeholder="0000 0000 0000 0000"
        data-testid="reg-ccnumber"
        maxlength="20"
      />

      <label class="label">Card Expiration Date</label>
      <input
        class="input"
        type="date"
        [value]="ccExpiration()"
        (input)="setCcExpiration(($any($event.target).value))"
        data-testid="reg-ccexpiration"
        maxlength="50"
      />

      <label class="label">Name on Card (First Name)</label>
      <input
        class="input"
        [value]="ccFirstName()"
        (input)="setCcFirstName(($any($event.target).value))"
        data-testid="reg-ccfirstname"
        maxlength="50"
      />

      <label class="label">Name on Card (Last Name)</label>
      <input
        class="input"
        [value]="ccLastName()"
        (input)="setCcLastName(($any($event.target).value))"
        data-testid="reg-cclastname"
      />

      <button
        class="btn"
        (click)="submit()"
        data-testid="reg-submit"
      >
        {{ isLoading() ? 'Creating…' : 'Create Account' }}
      </button>

      <p class="register-link">
        Already have an account? <a routerLink="/login">Sign in here</a>
      </p>

      <div *ngIf="error()" class="err-box" data-testid="reg-error">
        {{ error() }}
      </div>

    </div>
  </div>
</section>
