<div class="container my-4">
  <div class="card shadow-sm">
    <div class="card-body">

      <div *ngIf="isLoading()" class="text-muted" data-testid="star-loading">
        Loading star details…
      </div>

      <div *ngIf="error()" class="text-danger mb-3" data-testid="star-error">
        {{ error() }}
      </div>

      <ng-container *ngIf="!isLoading() && star() as s">
        <h2 class="fw-bold mb-4" data-testid="star-name">
          {{ s.name }}
        </h2>

        <div class="mb-4">
          <p class="mb-0" *ngIf="s.birthYear != null">
            <strong>Birth Year:</strong>
            <span data-testid="star-birthyear">{{ s.birthYear }}</span>
          </p>
        </div>

        <div>
          <h5 class="fw-bold mb-3">Movies</h5>

          <div *ngIf="!movies()?.length" class="text-muted" data-testid="no-movies">
            No movies found.
          </div>

          <ul class="movie-list ps-3 mb-0" *ngIf="movies()?.length" data-testid="movies-list">
            <li *ngFor="let m of movies()" class="mb-1">
              <a
                class="movie-link"
                data-testid="movie-link"
                [routerLink]="['/movies', m.id]">
                {{ m.title }}
              </a>
            </li>
          </ul>
        </div>
      </ng-container>

    </div>
  </div>
</div>
