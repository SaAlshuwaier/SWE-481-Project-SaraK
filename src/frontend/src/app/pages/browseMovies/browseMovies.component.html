<div class="container py-4">



  <!-- Header -->
  <div class="mb-4" data-testid="browse-header">
    <h1 class="mb-3" data-testid="browse-title">Browse Movies</h1>

<div
  class="d-flex flex-wrap align-items-center gap-3"
  data-testid="browse-controls"
>

  <!-- Context -->
  <span
    class="badge text-bg-light border px-3 py-2"
    *ngIf="contextTitle"
    data-testid="context-title"
  >
    <strong>{{ contextTitle }}</strong>
  </span>

  <!-- Sort -->
  <select
    class="form-select form-select-sm w-auto"
    data-testid="sort-select"
    (change)="onSortChange($event)"
  >
    <option value="Title">Title</option>
    <option value="Rating">Rating</option>
  </select>

  <!-- Order -->
  <select
    class="form-select form-select-sm w-auto"
    data-testid="order-select"
    (change)="onOrderChange($event)"
  >
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
  </select>

  <!-- Page size -->
  <div class="d-flex align-items-center gap-2">
    <label for="pageSizeSelect" class="mb-0 fw-medium">
      Page Size:
    </label>

    <select
      id="pageSizeSelect"
      class="form-select form-select-sm w-auto"
      data-testid="numOfMoviesPerPage-select"
      (change)="onPageSizeChange($event)"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
  </div>

</div>
  </div>

  <!-- Movies List -->
 <div class="row g-4 mt-4" data-testid="movies-list">
    <div
      class="col-12"
      *ngFor="let movie of sortedMovies"
      data-testid="movie-card"
    >
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="h5 card-title mb-3">
            <a
              data-testid="movie-link"
              class="text-decoration-none movie-title-browseMovies-link"
              [routerLink]="['/movies', movie.id]"
              [queryParams]="{
                from: 'genre',
                genreId: route.snapshot.paramMap.get('genreId'),
                genreName: route.snapshot.queryParams['genreName']
              }"
            >
              {{ movie.title }}
            </a>
          </h3>

          <p class="mb-1" data-testid="movie-year">
            <strong>Year:</strong> {{ movie.year }}
          </p>

          <p class="mb-1" data-testid="movie-director">
            <strong>Director:</strong> {{ movie.director }}
          </p>

          <p class="mb-2" data-testid="movie-rating">
            <strong>Rating:</strong> {{ movie.rating }}
          </p>

          <!-- Genres -->
          <p class="mb-2">
            <strong>Genres:</strong>
            <ng-container *ngFor="let g of movie.genres; let last = last">
              <a
                data-testid="genre-link"
                class="text-decoration-none genre-browseMovies-link"
                [routerLink]="['/movies/genre', g.id]"
                [queryParams]="{ genreName: g.name }"
              >
                {{ g.name }}
              </a>
              <span *ngIf="!last">, </span>
            </ng-container>
          </p>

          <!-- Stars -->
          <p class="mb-0">
            <strong>Stars:</strong>
            <ng-container *ngFor="let s of movie.stars; let last = last">
              <a
                data-testid="star-link"
                class="text-decoration-none star-browseMovies-link"
                [routerLink]="['/stars', s.id]"
              >
                {{ s.name }}
              </a>
              <span *ngIf="!last">, </span>
            </ng-container>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div
    class="d-flex justify-content-center align-items-center gap-3 mt-4"
    *ngIf="pageState"
    data-testid="pagination"
  >
    <button
      class="btn btn-primary"
      data-testid="prev-btn"
      (click)="previousPage()"
      [disabled]="!pageState.hasPrev"
    >
      Previous
    </button>

    <span class="fw-semibold" data-testid="page-number">
      Page {{ pageState.page }}
    </span>

    <button
      class="btn btn-primary"
      data-testid="next-btn"
      (click)="nextPage()"
      [disabled]="!pageState.hasNext"
    >
      Next
    </button>
  </div>
</div>
