<div class="container">

  <!-- Top Navigation -->
  <div class="top-nav">
    <button
      data-testid="back-home-btn"
      class="back-home-btn"
      [routerLink]="['/home']"
    >
      ← Back to Home
    </button>
  </div>

  <!-- Header -->
  <div class="page-header" data-testid="browse-header">

    <h1 data-testid="browse-title">Browse Movies</h1>

    <div class="controls" data-testid="browse-controls">

      <span class="context" *ngIf="contextTitle" data-testid="context-title">
        <strong>{{ contextTitle }}</strong>
      </span>

      <select
        data-testid="sort-select"
        (change)="onSortChange($event)"
      >
        <option value="Title">Title</option>
        <option value="Rating">Rating</option>
      </select>

      <select
        data-testid="order-select"
        (change)="onOrderChange($event)"
      >
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>

      <label for="pageSizeSelect">Page Size:</label>

      <select
        id="pageSizeSelect"
        data-testid="numOfMoviesPerPage-select"
        (change)="onPageSizeChange($event)"
      >
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

    </div>
  </div>

  <!-- Movies List -->
  <div class="movies" data-testid="movies-list">

    <div
      class="movie-card"
      *ngFor="let movie of sortedMovies"
      data-testid="movie-card"
    >
      <h3>
        <a
          data-testid="movie-link"
          class="movie-title-browseMovies-link"
          [routerLink]="['/movies', movie.id]"
        >
          {{ movie.title }}
        </a>
      </h3>

      <p data-testid="movie-year">Year: {{ movie.year }}</p>
      <p data-testid="movie-director">Director: {{ movie.director }}</p>
      <p data-testid="movie-rating">Rating: {{ movie.rating }}</p>


      <!-- Genres -->
      <p>
        Genres:
        <ng-container *ngFor="let g of movie.genres; let last = last">
          <a
            data-testid="genre-link"
            class="genre-browseMovies-link"
            [routerLink]="['/movies/genre', g.id]"
            [queryParams]="{ genreName: g.name }"
          >
            {{ g.name }}
          </a>
          <span *ngIf="!last">, </span>
        </ng-container>
      </p>

      <!-- Stars -->
      <p>
        Stars:
        <ng-container *ngFor="let s of movie.stars; let last = last">
          <a
            data-testid="star-link"
            class="star-browseMovies-link"
            [routerLink]="['/stars', s.id]"
          >
            {{ s.name }}
          </a>
          <span *ngIf="!last">, </span>
        </ng-container>
      </p>
    </div>
  </div>

  <!-- Pagination -->
  <div
    class="pagination"
    *ngIf="pageState"
    data-testid="pagination"
  >

    <button
      data-testid="prev-btn"
      (click)="previousPage()"
      [disabled]="!pageState.hasPrev"
    >
      Previous
    </button>

    <span data-testid="page-number">
      Page {{ pageState.page }}
    </span>

    <button
      data-testid="next-btn"
      (click)="nextPage()"
      [disabled]="!pageState.hasNext"
    >
      Next
    </button>
  </div>
</div>
