<section class="container py-5 d-flex justify-content-center">
  <div class="card p-4 shadow-sm w-100">
    <h2 class="h4 mb-4 fw-bold" data-testid="checkout-title">Checkout</h2>

    <div class="d-flex flex-column gap-3">
      <label class="form-label">First Name</label>
      <input
        class="form-control"
        data-testid="checkout-firstname"
        [value]="firstName()"
        (input)="setFirstName(($any($event.target).value))"
        placeholder="First name"
      />

      <label class="form-label">Last Name</label>
      <input
        class="form-control"
        data-testid="checkout-lastname"
        [value]="lastName()"
        (input)="setLastName(($any($event.target).value))"
        placeholder="Last name"
      />

      <!-- update data-testid="checkout-cardnumber" to ata-testid="checkout-card" -->
      <label class="form-label">Card Number</label>
      <input
        class="form-control"
        data-testid="checkout-card"
        [value]="cardNumber()"
        (input)="setCardNumber(($any($event.target).value))"
        placeholder="1234-5678-9012-3456"
      />

      <label class="form-label">Expiration</label>
      <input
        class="form-control"
        data-testid="checkout-expiration"
        [value]="expiration()"
        (input)="setExpiration(($any($event.target).value))"
        placeholder="2008/12/01"
      />

      <button
        class="btn btn-primary mt-2"
        data-testid="checkout-submit"
        (click)="submit()"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Processing…' : 'Pay Now' }}
      </button>

      <div *ngIf="error()" class="alert alert-danger mt-2" data-testid="checkout-error">
        {{ error() }}
      </div>

      <div *ngIf="result()" class="alert alert-success mt-2" data-testid="checkout-success">
        <div class="fw-bold">Response</div>
        <div data-testid="checkout-success-message">
          {{ result()?.message }}
        </div>
      </div>
    </div>
  </div>
</section> */
