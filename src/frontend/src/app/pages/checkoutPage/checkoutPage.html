<section class="container py-5 d-flex justify-content-center">
  <div class="card p-4 shadow-sm w-100">
    <h2 class="h4 mb-4 fw-bold">Checkout</h2>

          <div *ngIf="showSuccessToast()" class="alert alert-success mt-2">
        <div class="fw-bold">Response</div>
        <div>
          {{ result()?.message }}
        </div>
      </div>
      
    <div class="d-flex flex-column gap-3">
      <label class="form-label" for="checkoutFirstName">Name on Card (First Name)</label>
      <input
  class="form-control"
  id="checkoutFirstName"
  [value]="firstName()"
  (input)="setFirstName(($any($event.target).value))"
  (blur)="firstNameTouched.set(true)"
  placeholder="First name"
/>

<div *ngIf="firstName() && !isValidCardName(firstName())"
  class="text-danger small">
  Name on card must contain English letters only
</div>

      <label class="form-label" for="checkoutLastName">Name on Card (Last Name)</label>
      <input
  class="form-control"
  id="checkoutLastName"
  [value]="lastName()"
  (input)="setLastName(($any($event.target).value))"
  (blur)="lastNameTouched.set(true)"
  placeholder="Last name"
/>

<div *ngIf="lastName() && !isValidCardName(lastName())"
  class="text-danger small">
  Name on card must contain English letters only
</div>

      <label class="form-label" for="checkoutCard">Card Number</label>
      <input
  class="form-control"
  id="checkoutCard"
  [value]="cardNumber()"
  (input)="setCardNumber(($any($event.target).value))"
  placeholder="0000 0000 0000 0000"
  maxlength="20"
  type="text"
  inputmode="numeric"
  pattern="[0-9 ]*"
  
/>
<div *ngIf="cardNumber() && !isValidCcNumber(cardNumber())"
  class="text-danger small">
  Card number must contain digits only
</div>



      <label class="form-label" for="checkoutExpiration">Card Expiration Date</label>
      <input
  class="input form-control"
  id="checkoutExpiration"
  type="date"
  [value]="expiration()"

  (input)="setExpiration(($any($event.target).value))"
  maxlength="50"
/>

      <button
        class="btn btn-primary mt-2"
        (click)="submit()"
        [disabled]="isLoading() || !firstName() || !lastName() || !cardNumber() || !expiration() || !isValidCardName(firstName()) || !isValidCardName(lastName()) || !isValidCcNumber(cardNumber())"
      >
        {{ isLoading() ? 'Processing…' : 'Pay Now' }}
      </button>

      <div *ngIf="error()" class="alert alert-danger mt-2">
        {{ error() }}
      </div>

    </div>
  </div>
</section>
