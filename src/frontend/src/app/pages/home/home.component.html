<div class="container my-4">

  <h2 class="text-center fw-bold mb-1">IMDB Movie Store</h2>
<!--
<nav class="mb-4">
  <a class="me-3" routerLink="/home">Home</a>
  <a class="me-3" routerLink="/movies">Movies</a>
  <a class="me-3" routerLink="/cart">Cart</a>
  <a routerLink="/logout">Logout</a>
</nav>
-->
  <div class="card shadow-sm mb-4">
    <div class="card-body">

      <h5 class="fw-bold mb-3">Search Movies</h5>

      <div class="row g-3 align-items-end">

        <!-- Title -->
        <div class="col-md-3">
          <label class="form-label">Title</label>
          <input class="form-control" placeholder="Search by title"
                 [(ngModel)]="filters.title" />
        </div>

        <!-- Year -->
        <div class="col-md-2">
          <label class="form-label">Year</label>
          <input class="form-control" placeholder="e.g. 1994"
                 [(ngModel)]="filters.year" />
        </div>

        <!-- Director -->
        <div class="col-md-3">
          <label class="form-label">Director</label>
          <input class="form-control" placeholder="Search by director..."
                 [(ngModel)]="filters.director" />
        </div>

        <!-- Star -->
        <div class="col-md-3">
          <label class="form-label">Star Name</label>
          <input class="form-control" placeholder="Search by star..."
                 [(ngModel)]="filters.star" />
        </div>

        <!-- Search Button -->
        <div class="col-md-1 d-grid">
          <button class="btn btn-primary" (click)="goToSearchResults()">
            Search
          </button>
        </div>

        <!-- Clear Button -->
        <div class="col-md-2 d-grid">
          <button class="btn btn-outline-secondary" (click)="onClear()">
            Clear
          </button>
        </div>
      </div>

      <small class="text-muted d-block mt-2">
        * You can search by one or multiple criteria. All fields are optional.
      </small>

    </div>
  </div>

  <!--
       Browse by Genre
       Genres are loaded dynamically from the backend API via GenreService and rendered using *ngFor
       Navigate to /movies/genre/:id
   -->
  <h6 class="fw-bold mb-2">Browse by Genre</h6>
  <div class="d-flex flex-wrap gap-2 mb-4">
    <button *ngFor="let g of genres"
            class="btn btn-sm btn-outline-secondary"
            (click)="goToBrowseGenre(g)">
      {{ g.name }}
    </button>
  </div>

  <!-- =========================
       Browse by Title
  ========================= -->
  <h6 class="fw-bold mb-2">Browse by Title</h6>
  <div class="d-flex flex-wrap gap-2">
    <button *ngFor="let t of titleFilters"
            class="btn btn-sm btn-outline-secondary"
            (click)="goToBrowseTitle(t)">
      {{ t }}
    </button>
  </div>

</div>
